# ==============================================================================
# Enterprise Event Correlation Pipeline Configuration
# ==============================================================================

# Application Meta
app.name=flink-dual-topic-event-correlation
app.environment=production
app.version=1.0.0

# ------------------------------------------------------------------------------
# Kafka Ingestion & Egress
# ------------------------------------------------------------------------------
kafka.bootstrap.servers=localhost:9092
kafka.group.id=flink-event-join-cg
kafka.auto.offset.reset=earliest
kafka.isolation.level=read_committed

# Source Topics
kafka.topic.source.a=topic_a
kafka.topic.source.b=topic_b

# Sinks & DLQ Topics
kafka.topic.sink.merged=merged_events
kafka.topic.sink.shadow=shadow_events
kafka.topic.sink.payload=payload_events
kafka.topic.dlq.validation=validation_dlq
kafka.topic.dlq.aerospike=aerospike_dlq
kafka.topic.dlq.correlation=correlation_dlq
kafka.topic.dlq.payload.fetch=payload_fetch_dlq
kafka.topic.dlq.processing=processing_dlq

# Kafka Producer Reliability & High Throughput
kafka.producer.acks=1
kafka.producer.retries=10
kafka.producer.max.in.flight.requests.per.connection=5
kafka.producer.compression.type=snappy
kafka.producer.batch.size=131072
kafka.producer.linger.ms=5

# ------------------------------------------------------------------------------
# Aerospike Configuration
# ------------------------------------------------------------------------------
aerospike.hosts=localhost:3000
aerospike.namespace=test
aerospike.set.name=event_payloads
aerospike.user=
aerospike.password=
aerospike.max.connections.per.node=300
aerospike.connection.timeout.ms=2000
aerospike.socket.timeout.ms=1000
aerospike.total.timeout.ms=3000
aerospike.max.retries=3
aerospike.sleep.between.retries.ms=100
aerospike.payload.ttl.seconds=1800

# ------------------------------------------------------------------------------
# Flink Runtime & Checkpointing
# ------------------------------------------------------------------------------
flink.parallelism.default=4
flink.checkpoint.interval.ms=30000
flink.checkpoint.timeout.ms=120000
flink.checkpoint.min.pause.ms=10000
flink.checkpoint.max.concurrent=1
flink.checkpoint.tolerable.failures=2
flink.checkpoint.storage.directory=file:///tmp/flink-checkpoints/correlation-pipeline
flink.state.backend.rocksdb.incremental=true

# ------------------------------------------------------------------------------
# Stateful Correlation & Timeout Windows
# ------------------------------------------------------------------------------
correlation.timeout.seconds=600
correlation.timer.type=PROCESSING_TIME
correlation.max.out.of.orderness.seconds=30
