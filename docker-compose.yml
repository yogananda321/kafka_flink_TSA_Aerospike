networks:
  flink-net:
    driver: bridge

services:
  # ==============================================================================
  # Kafka Broker (KRaft Mode)
  # ==============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '4L62EnnPTjiAUmAbpauseA'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_MS: 300000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - flink-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Aerospike Server
  # ==============================================================================
  aerospike:
    image: aerospike/aerospike-server:latest
    container_name: aerospike
    hostname: aerospike
    ports:
      - "3000:3000"
    environment:
      - NAMESPACE=test
    volumes:
      - ./aerospike.conf/aerospike.conf:/etc/aerospike/aerospike.conf
    networks:
      - flink-net
    healthcheck:
      test: ["CMD-SHELL", "asinfo -v 'status' | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Flink JobManager
  # ==============================================================================
  jobmanager:
    image: flink:1.19.1-java17
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JAVA_TOOL_OPTIONS=--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 2048m
        parallelism.default: 4
        state.backend: rocksdb
        state.backend.incremental: true
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 10000
        execution.checkpointing.unaligned.enabled: true
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    volumes:
      - .:/opt/flink/project
      - ./checkpoints:/tmp/flink-checkpoints
    networks:
      - flink-net
    depends_on:
      kafka:
        condition: service_healthy
      aerospike:
        condition: service_healthy

  # ==============================================================================
  # Flink TaskManager
  # ==============================================================================
  taskmanager:
    image: flink:1.19.1-java17
    command: taskmanager
    scale: 1
    environment:
      - JAVA_TOOL_OPTIONS=--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.managed.size: 1024m
        parallelism.default: 4
        state.backend: rocksdb
        state.backend.incremental: true
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 10000
        execution.checkpointing.unaligned.enabled: true
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    volumes:
      - .:/opt/flink/project
      - ./checkpoints:/tmp/flink-checkpoints
    networks:
      - flink-net
    depends_on:
      - jobmanager
